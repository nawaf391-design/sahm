import os
import threading
import tkinter as tk
from tkinter import ttk, messagebox, scrolledtext
import yfinance as yf
import ta
from crewai import Agent, Task, Crew, Process
from langchain.tools import tool

# ==========================================
# 1. أداة الفحص والتصفية الفنية
# ==========================================
@tool("Multi-Stock TASI Technical Screener")
def scan_tasi_stocks(tickers_list: str) -> str:
    """
    تقوم هذه الأداة بفحص قائمة من أسهم السوق السعودي (مفصولة بفاصلة مثل: '1120.SR, 2010.SR')
    وتحسب المؤشرات الفنية اللحظية لكل سهم لتسهيل التصفية والمقارنة.
    """
    tickers = [t.strip() for t in tickers_list.split(',')]
    summary_results = []

    for ticker in tickers:
        try:
            stock = yf.Ticker(ticker)
            df = stock.history(period="5d", interval="15m")
            if df.empty:
                continue

            # حساب المؤشرات
            df['RSI'] = ta.momentum.RSIIndicator(close=df['Close'], window=14).rsi()
            macd = ta.trend.MACD(close=df['Close'])
            df['MACD'] = macd.macd()
            df['MACD_Signal'] = macd.macd_signal()
            df['EMA_20'] = ta.trend.EMAIndicator(close=df['Close'], window=20).ema_indicator()
            df['EMA_50'] = ta.trend.EMAIndicator(close=df['Close'], window=50).ema_indicator()

            latest = df.iloc[-1]
            recent_data = df.tail(20)
            support = recent_data['Low'].min()
            resistance = recent_data['High'].max()

            is_bullish_trend = latest['EMA_20'] > latest['EMA_50']
            macd_cross = latest['MACD'] > latest['MACD_Signal']

            summary_results.append({
                "ticker": ticker,
                "price": round(latest['Close'], 2),
                "rsi": round(latest['RSI'], 2),
                "macd_positive": macd_cross,
                "bullish_trend": is_bullish_trend,
                "support": round(support, 2),
                "resistance": round(resistance, 2)
            })
        except Exception:
            continue

    if not summary_results:
        return "لم يتم العثور على بيانات صالحة للأسهم الممررة."

    output = "نتائج فحص الأسهم اللحظي:\n"
    for res in summary_results:
        output += f"- سهم {res['ticker']}: السعر {res['price']} ريال | RSI: {res['rsi']} | اتجاه صاعد: {res['bullish_trend']} | تقاطع MACD إيجابي: {res['macd_positive']} | دعم: {res['support']} | مقاومة: {res['resistance']}\n"
    return output

# ==========================================
# 2. منطق تشغيل الذكاء الاصطناعي (CrewAI)
# ==========================================
def run_crew_logic(api_key, stocks_list, output_widget, progress_bar, start_btn):
    # تعيين مفتاح التشفير
    os.environ["OPENAI_API_KEY"] = api_key

    # إنشاء الوكيل
    stock_screener_agent = Agent(
        role='محلل ومصفي صفقات تاسي اللحظية',
        goal='مقارنة عدة أسهم في السوق السعودي واختيار أفضل سهم واحد يمتلك أعلى فرصة مضاربية ومخاطرة منخفضة.',
        backstory="""أنت مضارب محترف في السوق السعودي، مهمتك ليست التوصية بكل الأسهم،
        بل اختيار "السهم الماسي" الفائز بفرصة دخول آمنة وسريعة بناءً على مؤشرات RSI و MACD والمحاذاة مع المتوسطات المتحركة.""",
        tools=[scan_tasi_stocks],
        verbose=True
    )

    # إنشاء المهمة
    multi_scan_task = Task(
        description=f"""
        افحص قائمة الأسهم التالية: [{stocks_list}] باستخدام أداة 'Multi-Stock TASI Technical Screener'.
        
        خطوات العمل المطلوب منك تنفيذها:
        1. قارن المؤشرات الفنية بين جميع الأسهم المفحوصة.
        2. استبعد الأسهم التي يكون فيها مؤشر RSI ألمح إلى تشبع شرائي (> 70) أو ذات اتجاه هابط.
        3. اختر السهم الأفضل فقط من حيث قوة الزخم الإيجابي واقترابه من مستوى دعم قوي.
        4. صغ خطة تداول لحظية كاملة لهذا السهم المختار حصراً.
        """,
        expected_output="""تقرير صفقات يركز على سهم واحد متصدر:
        - اسم/رمز السهم المختار للأفضلية
        - أسباب استبعاد الأسهم الأخرى باختصار
        - سعر الدخول المقترح للسهم الفائز
        - الهدف اللحظي (Take Profit)
        - حد وقف الخسارة (Stop Loss)
        """,
        agent=stock_screener_agent
    )

    # تشغيل النظام
    crew = Crew(
        agents=[stock_screener_agent],
        tasks=[multi_scan_task],
        process=Process.sequential
    )

    try:
        result = crew.kickoff()
        # تحديث الواجهة بالنتيجة
        output_widget.delete(1.0, tk.END)
        output_widget.insert(tk.END, result)
    except Exception as e:
        messagebox.showerror("خطأ", f"حدث خطأ أثناء التشغيل:\n{str(e)}")
    finally:
        progress_bar.stop()
        start_btn.config(state=tk.NORMAL)

# ==========================================
# 3. بناء الواجهة الرسومية (GUI)
# ==========================================
class TasiScreenerApp:
    def __init__(self, root):
        self.root = root
        self.root.title("مستشار تاسي الذكي اللحظي")
        self.root.geometry("700x650")
        self.root.configure(bg="#f4f6f9")
        
        # التنسيق العام والخطوط
        style = ttk.Style()
        style.theme_use('clam')
        
        # عنوان البرنامج
        title_lbl = tk.Label(root, text="🔍 نظام فحص واقتناص فرص الأسهم السعودية (TASI)", font=("Arial", 16, "bold"), bg="#f4f6f9", fg="#2c3e50")
        title_lbl.pack(pady=15)

        # إدخال OpenAI API Key
        api_frame = tk.LabelFrame(root, text=" إعدادات الاتصال بالذكاء الاصطناعي ", font=("Arial", 10, "bold"), bg="#f4f6f9", padx=10, pady=5)
        api_frame.pack(fill="x", padx=20, pady=5)
        
        tk.Label(api_frame, text="OpenAI API Key:", bg="#f4f6f9").pack(side="left", padx=5)
        self.api_entry = ttk.Entry(api_frame, show="*", width=50)
        self.api_entry.pack(side="left", fill="x", expand=True, padx=5)
        # يمكنك وضع مفتاحك الافتراضي هنا للتسهيل أثناء التجربة:
        # self.api_entry.insert(0, "sk-...")

        # إدخال الأسهم المستهدفة
        stocks_frame = tk.LabelFrame(root, text=" قائمة الأسهم المراد فحصها ", font=("Arial", 10, "bold"), bg="#f4f6f9", padx=10, pady=5)
        stocks_frame.pack(fill="x", padx=20, pady=10)
        
        self.stocks_entry = ttk.Entry(stocks_frame, font=("Arial", 11))
        self.stocks_entry.pack(fill="x", padx=5, pady=5)
        self.stocks_entry.insert(0, "1120.SR, 2010.SR, 2222.SR, 1150.SR, 2082.SR")
        
        note_lbl = tk.Label(stocks_frame, text="* يرجى إدخال الرموز مفصولة بفاصلة متبوعة بـ .SR (مثل الرموز الافتراضية أعلاه)", font=("Arial", 9, "italic"), bg="#f4f6f9", fg="#7f8c8d")
        note_lbl.pack(anchor="w", padx=5)

        # زر التشغيل وشريط التقدم
        self.start_btn = tk.Button(root, text="بدء الفحص والتحليل اللحظي 🚀", font=("Arial", 12, "bold"), bg="#27ae60", fg="white", bd=0, cursor="hand2", command=self.start_analysis, padding=8)
        self.start_btn.pack(pady=10)
        
        self.progress = ttk.Progressbar(root, orient="horizontal", mode="indeterminate", length=500)
        self.progress.pack(pady=5)

        # صندوق عرض النتائج
        result_frame = tk.LabelFrame(root, text=" التوصية والتقرير الفني الفائز ", font=("Arial", 10, "bold"), bg="#f4f6f9", padx=10, pady=5)
        result_frame.pack(fill="both", expand=True, padx=20, pady=10)
        
        self.result_text = scrolledtext.ScrolledText(result_frame, wrap=tk.WORD, font=("Arial", 11), bg="white", fg="#2c3e50")
        self.result_text.pack(fill="both", expand=True)

    def start_analysis(self):
        api_key = self.api_entry.get().strip()
        stocks = self.stocks_entry.get().strip()

        if not api_key:
            messagebox.showwarning("تنبيه", "الرجاء إدخال مفتاح OpenAI API Key الخاص بك أولاً.")
            return
        if not stocks:
            messagebox.showwarning("تنبيه", "الرجاء كتابة رمز سهم واحد على الأقل لفحصه.")
            return

        self.result_text.delete(1.0, tk.END)
        self.result_text.insert(tk.END, "جاري سحب البيانات اللحظية وتشغيل وكيل الذكاء الاصطناعي للفحص والمقارنة... يرجى الانتظار لحين الانتهاء.\n")
        
        self.start_btn.config(state=tk.DISABLED)
        self.progress.start(10)
        
        # تشغيل العملية في Thread منفصل لعدم تجميد واجهة البرنامج
        threading.Thread(target=run_crew_logic, args=(api_key, stocks, self.result_text, self.progress, self.start_btn), daemon=True).start()

if __name__ == "__main__":
    root = tk.Tk()
    app = TasiScreenerApp(root)
    root.mainloop()
